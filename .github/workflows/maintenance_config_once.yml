name: One-time config integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[config-maintenance]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Integrate centralized config validation
        shell: python
        run: |
          from pathlib import Path

          path = Path('virelion_cardioscore/analysis/pipeline.py')
          text = path.read_text(encoding='utf-8')
          import_old = 'from virelion_cardioscore.utils.coercion import coerce_bool_series\n'
          import_new = import_old + 'from virelion_cardioscore.validation.config import validate_pipeline_config\n'
          if import_old not in text:
              raise SystemExit('Expected pipeline coercion import not found; refusing to patch.')
          if 'from virelion_cardioscore.validation.config import validate_pipeline_config' not in text:
              text = text.replace(import_old, import_new, 1)
          init_old = '    def __init__(self, config: dict):\n        self.config = config\n'
          init_new = '    def __init__(self, config: dict):\n        validate_pipeline_config(config)\n        self.config = config\n'
          if init_old not in text:
              raise SystemExit('Expected CardioScorePipeline.__init__ block not found; refusing to patch.')
          text = text.replace(init_old, init_new, 1)
          path.write_text(text, encoding='utf-8')
      - name: Verify syntax
        run: python -m py_compile virelion_cardioscore/analysis/pipeline.py virelion_cardioscore/validation/config.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add virelion_cardioscore/analysis/pipeline.py virelion_cardioscore/validation/config.py
          git diff --cached --check
          git commit -m "Integrate centralized configuration validation [config-maintenance]"
          git push
