name: One-time maintenance patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[maintenance-once]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch dose-response input validation
        shell: python
        run: |
          from pathlib import Path

          path = Path('virelion_cardioscore/analysis/dose_response.py')
          text = path.read_text(encoding='utf-8')
          old = '''    x = np.asarray(concentrations, dtype=float)\n    y = np.asarray(responses, dtype=float)\n    sigma = None if response_sem is None else np.asarray(response_sem, dtype=float)\n    finite = np.isfinite(x) & np.isfinite(y) & (x > 0)\n    if sigma is not None:\n        if sigma.shape != x.shape:\n            raise ValueError("response_sem must have the same shape as concentrations and responses.")\n        finite &= np.isfinite(sigma) & (sigma > 0)\n    x = x[finite]\n    y = y[finite]\n    if sigma is not None:\n        sigma = sigma[finite]\n\n    if len(x) < min_points:\n'''
          new = '''    x = np.asarray(concentrations, dtype=float)\n    y = np.asarray(responses, dtype=float)\n    sigma = None if response_sem is None else np.asarray(response_sem, dtype=float)\n\n    if x.ndim != 1 or y.ndim != 1:\n        raise ValueError("concentrations and responses must be one-dimensional arrays.")\n    if x.shape != y.shape:\n        raise ValueError("concentrations and responses must have the same shape.")\n    if sigma is not None:\n        if sigma.shape != x.shape:\n            raise ValueError("response_sem must have the same shape as concentrations and responses.")\n        if not np.isfinite(sigma).all() or (sigma <= 0).any():\n            raise ValueError("response_sem must contain finite, strictly positive values.")\n    if not np.isfinite(x).all() or not np.isfinite(y).all():\n        raise ValueError("concentrations and responses must contain only finite values.")\n    if (x <= 0).any():\n        raise ValueError("4PL fitting requires strictly positive concentrations; invalid concentrations were supplied.")\n\n    if len(x) < min_points:\n'''
          if old not in text:
              raise SystemExit('Expected dose-response input block not found; refusing to patch.')
          text = text.replace(old, new, 1)
          old_dup = '''    if np.unique(x).size < min_points:\n        return DoseResponseFit(endpoint=endpoint, success=False, quality_pass=False, n_points=int(np.unique(x).size), effect_threshold=effect_threshold, min_ec50_coverage=min_ec50_coverage, message=f"Need at least {min_points} distinct positive concentrations.")\n'''
          new_dup = '''    n_unique = int(np.unique(x).size)\n    if n_unique != len(x):\n        raise ValueError("4PL fitting requires one response per concentration; duplicate concentrations were supplied.")\n    if n_unique < min_points:\n        return DoseResponseFit(endpoint=endpoint, success=False, quality_pass=False, n_points=n_unique, effect_threshold=effect_threshold, min_ec50_coverage=min_ec50_coverage, message=f"Need at least {min_points} distinct positive concentrations.")\n'''
          if old_dup not in text:
              raise SystemExit('Expected duplicate-concentration block not found; refusing to patch.')
          text = text.replace(old_dup, new_dup, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add virelion_cardioscore/analysis/dose_response.py
          git diff --cached --check
          git commit -m "Fail closed on malformed 4PL inputs [maintenance-once]"
          git push
