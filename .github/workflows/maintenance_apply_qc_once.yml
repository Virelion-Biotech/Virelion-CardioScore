name: maintenance-apply-qc-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[apply-qc-maintenance]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch apply_qc direct-use behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("virelion_cardioscore/analysis/pipeline.py")
          text = path.read_text(encoding="utf-8")
          old = '''        endpoint_complete = np.ones(len(df), dtype=bool)\n        for endpoint in RUNTIME_ENDPOINT_COLUMNS:\n            numeric = pd.to_numeric(df[endpoint], errors="coerce")\n            endpoint_complete &= np.isfinite(numeric.to_numpy(dtype=float))\n'''
          new = '''        endpoint_complete = np.ones(len(df), dtype=bool)\n        available_endpoints = [endpoint for endpoint in RUNTIME_ENDPOINT_COLUMNS if endpoint in df.columns]\n        for endpoint in available_endpoints:\n            numeric = pd.to_numeric(df[endpoint], errors="coerce")\n            endpoint_complete &= np.isfinite(numeric.to_numpy(dtype=float))\n'''
          if old not in text:
              raise SystemExit("expected apply_qc endpoint block not found")
          text = text.replace(old, new, 1)

          old_log = '''                missing_endpoints = [\n                    endpoint\n                    for endpoint in RUNTIME_ENDPOINT_COLUMNS\n                    if not np.isfinite(pd.to_numeric(pd.Series([row[endpoint]]), errors="coerce").iloc[0])\n                ]\n'''
          new_log = '''                missing_endpoints = [\n                    endpoint\n                    for endpoint in available_endpoints\n                    if not np.isfinite(pd.to_numeric(pd.Series([row[endpoint]]), errors="coerce").iloc[0])\n                ]\n'''
          if old_log not in text:
              raise SystemExit("expected apply_qc logging block not found")
          text = text.replace(old_log, new_log, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add virelion_cardioscore/analysis/pipeline.py
          git diff --cached --check
          git commit -m "Fix direct QC handling of optional endpoint columns [apply-qc-maintenance]"
          git push
