name: One-time browser contract integration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[browser-contract]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Integrate browser scoring contract
        shell: python
        run: |
          from pathlib import Path

          path = Path('web/app.js')
          text = path.read_text(encoding='utf-8')
          marker = "  var PRESETS={\n"
          insert = "  var scoringContract=null;\n  fetch('scoring_contract.json')\n    .then(function(response){\n      if(!response.ok) throw new Error('Unable to load scoring contract.');\n      return response.json();\n    })\n    .then(function(contract){scoringContract=contract;})\n    .catch(function(){scoringContract=null;});\n\n"
          if marker not in text:
              raise SystemExit('Expected PRESETS marker not found; refusing to patch.')
          if 'var scoringContract=null;' not in text:
              text = text.replace(marker, insert + marker, 1)

          old = "  function weights(){return{fpd:numericOrDefault('w_fpd',0.3),rate:numericOrDefault('w_rate',0.15),amp:numericOrDefault('w_amp',0.15),stv:numericOrDefault('w_stv',0.25),tri:numericOrDefault('w_tri',0.15)}}\n"
          new = "  function weights(){\n    if(!scoringContract || !scoringContract.endpoints) throw new Error('Scoring contract is not loaded.');\n    return {\n      fpd:scoringContract.endpoints.fpd_change_pct.weight,\n      rate:scoringContract.endpoints.beat_rate_change_pct.weight,\n      amp:scoringContract.endpoints.amplitude_change_pct.weight,\n      stv:scoringContract.endpoints.stv_increase.weight,\n      tri:scoringContract.endpoints.triangulation_proxy.weight\n    };\n  }\n"
          if old not in text:
              raise SystemExit('Expected weights function not found; refusing to patch.')
          text = text.replace(old, new, 1)

          old_click = "  document.getElementById('run').onclick=function(){var rows=uploaded&&uploaded.length?uploaded:generate(numericOrDefault('nComp',4),numericOrDefault('nConc',6),numericOrDefault('seed',42),document.getElementById('preset').value,document.getElementById('includeToxic').checked);var qc=applyQc(rows);render(scoreRows(qc.rows,weights(),numericOrDefault('th_low',0.3),numericOrDefault('th_mod',0.6)),qc.log)};\n"
          new_click = "  document.getElementById('run').onclick=function(){\n    if(!scoringContract){alert('Scoring contract is still loading; please run again.');return;}\n    var rows=uploaded&&uploaded.length?uploaded:generate(numericOrDefault('nComp',4),numericOrDefault('nConc',6),numericOrDefault('seed',42),document.getElementById('preset').value,document.getElementById('includeToxic').checked);\n    var qc=applyQc(rows);\n    render(scoreRows(qc.rows,weights(),scoringContract.risk_thresholds.low,scoringContract.risk_thresholds.moderate),qc.log)\n  };\n"
          if old_click not in text:
              raise SystemExit('Expected run handler not found; refusing to patch.')
          text = text.replace(old_click, new_click, 1)
          path.write_text(text, encoding='utf-8')
      - name: Verify JavaScript
        run: node --check web/app.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/app.js
          git diff --cached --check
          git commit -m "Use shared scoring contract in browser [browser-contract]"
          git push
