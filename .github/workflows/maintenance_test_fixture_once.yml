name: maintenance-test-fixture-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    # One-shot maintenance workflow; deleted after the bot commit lands.
    if: ${{ !contains(github.event.head_commit.message, '[fixture-maintenance]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pandas-compatible fixture
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_scoring.py")
          text = path.read_text(encoding="utf-8")
          old = '    frame = _runtime_frame()\n    frame.loc[0, "amplitude_uv"] = "bad"\n'
          new = '    frame = _runtime_frame()\n    frame["amplitude_uv"] = frame["amplitude_uv"].astype(object)\n    frame.loc[0, "amplitude_uv"] = "bad"\n'
          if old not in text:
              raise SystemExit("expected non-numeric feature fixture not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_scoring.py
          git diff --cached --check
          git commit -m "Make non-numeric feature fixture pandas-compatible [fixture-maintenance]"
          git push
