name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Collect Ruff-safe autofixes
        if: matrix.python-version == '3.11'
        run: |
          ruff check --fix . || true
          tar -czf /tmp/cardioscore-ruff-fixed.tar.gz . \
            --exclude='./.git' \
            --exclude='./.pytest_cache' \
            --exclude='./outputs'

      - name: Upload Ruff-fixed source artifact
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: cardioscore-ruff-fixed
          path: /tmp/cardioscore-ruff-fixed.tar.gz
          if-no-files-found: error

      - name: Run lint
        run: ruff check .

      - name: Run tests
        run: pytest -v --tb=short

      - name: Demo smoke test
        run: |
          cardioscore demo --output-dir /tmp/cardioscore-demo
          test -f /tmp/cardioscore-demo/summary.csv
          test -f /tmp/cardioscore-demo/report.html
