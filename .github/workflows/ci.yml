name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply safe Ruff autofixes and commit
        if: matrix.python-version == '3.11' && !startsWith(github.event.head_commit.message, 'chore: ruff autofix')
        run: |
          ruff check --fix . || true
          if git diff --quiet; then
            echo "No Ruff safe fixes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: ruff autofix"
          git push

      - name: Run lint
        run: ruff check .

      - name: Run tests
        run: pytest -v --tb=short

      - name: Demo smoke test
        run: |
          cardioscore demo --output-dir /tmp/cardioscore-demo
          test -f /tmp/cardioscore-demo/summary.csv
          test -f /tmp/cardioscore-demo/report.html
