name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,mixed]"

      - name: Validate browser JavaScript
        run: node --check web/app.js

      - name: Run lint
        run: ruff check .

      - name: Run tests
        run: pytest -v --tb=short

      - name: Demo smoke test
        run: |
          cardioscore demo --output-dir /tmp/cardioscore-demo
          test -f /tmp/cardioscore-demo/summary.csv
          test -f /tmp/cardioscore-demo/report.html

      - name: Build and validate wheel
        run: |
          rm -rf /tmp/cardioscore-dist /tmp/cardioscore-wheel-env /tmp/cardioscore-wheel-demo
          mkdir -p /tmp/cardioscore-dist
          pip wheel . --no-deps -w /tmp/cardioscore-dist
          python -m venv /tmp/cardioscore-wheel-env
          /tmp/cardioscore-wheel-env/bin/python -m pip install --upgrade pip
          /tmp/cardioscore-wheel-env/bin/pip install /tmp/cardioscore-dist/*.whl
          /tmp/cardioscore-wheel-env/bin/python -m pip check
          /tmp/cardioscore-wheel-env/bin/cardioscore version
          /tmp/cardioscore-wheel-env/bin/cardioscore demo --output-dir /tmp/cardioscore-wheel-demo
          test -f /tmp/cardioscore-wheel-demo/summary.csv
          test -f /tmp/cardioscore-wheel-demo/report.html
