name: maintenance-provenance-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[provenance-maintenance]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install patch dependencies
        run: python -m pip install --disable-pip-version-check ruff
      - name: Integrate PipelineResult provenance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("virelion_cardioscore/analysis/pipeline.py")
          text = path.read_text(encoding="utf-8")

          if "from virelion_cardioscore.reporting.provenance import build_provenance" not in text:
              anchor = "from virelion_cardioscore.validation.config import validate_pipeline_config\n"
              if anchor not in text:
                  raise SystemExit("pipeline import anchor not found")
              text = text.replace(
                  anchor,
                  anchor + "from virelion_cardioscore.reporting.provenance import build_provenance\n",
                  1,
              )

          old_field = '    qc_log: list[str] = field(default_factory=list)\n'
          new_field = old_field + '    provenance: dict = field(default_factory=dict)\n'
          if new_field not in text:
              if old_field not in text:
                  raise SystemExit("PipelineResult field anchor not found")
              text = text.replace(old_field, new_field, 1)

          old_payload = '            "dose_response_fits": {\n                compound: [fit.to_dict() for fit in fits]\n                for compound, fits in self.dose_response_fits.items()\n            },\n'
          new_payload = old_payload + '            "provenance": self.provenance,\n'
          if new_payload not in text:
              if old_payload not in text:
                  raise SystemExit("PipelineResult JSON anchor not found")
              text = text.replace(old_payload, new_payload, 1)

          old_return = '''        if not summary.empty:\n            summary = summary.sort_values("cardioscore", ascending=False)\n        return PipelineResult(\n'''
          new_return = '''        if not summary.empty:\n            summary = summary.sort_values("cardioscore", ascending=False)\n        excluded_compounds = sorted(\n            set(map(str, concentration_summary["compound"].unique())) - scorable_compounds\n        ) if not concentration_summary.empty else []\n        provenance = build_provenance(\n            input_frame=(dataset.features if isinstance(dataset, SyntheticMEADataset) else dataset),\n            config=self.config,\n            input_rows_after_qc=len(df),\n            effect_rows=len(effects),\n            scoring_unit_rows=len(scoring_effects),\n            excluded_compounds=excluded_compounds,\n            qc_log=self.qc_log,\n        )\n        return PipelineResult(\n'''
          if new_return not in text:
              if old_return not in text:
                  raise SystemExit("PipelineResult return anchor not found")
              text = text.replace(old_return, new_return, 1)

          old_tail = '            config=self.config,\n            qc_log=self.qc_log,\n        )\n'
          new_tail = '            config=self.config,\n            qc_log=self.qc_log,\n            provenance=provenance,\n        )\n'
          if new_tail not in text:
              if old_tail not in text:
                  raise SystemExit("PipelineResult constructor tail not found")
              text = text.replace(old_tail, new_tail, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit patch
        shell: bash
        run: |
          python -m compileall -q virelion_cardioscore
          ruff check virelion_cardioscore/analysis/pipeline.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add virelion_cardioscore/analysis/pipeline.py
          git commit -m "Integrate machine-readable pipeline provenance [provenance-maintenance]"
          git push
