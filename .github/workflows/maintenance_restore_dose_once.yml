name: maintenance-restore-dose-once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ !contains(github.event.head_commit.message, '[dose-restore]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore dose-response source exactly
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          subprocess.run(["git", "show", "941f762eebf0b1f174fd2229d09049a64b2c83ff:virelion_cardioscore/analysis/dose_response.py"], check=True, stdout=open("/tmp/dose.py", "w"))
          Path("virelion_cardioscore/analysis/dose_response.py").write_text(Path("/tmp/dose.py").read_text(), encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add virelion_cardioscore/analysis/dose_response.py
          git commit -m "Restore dose-response module before surgical guard [dose-restore]"
          git push
