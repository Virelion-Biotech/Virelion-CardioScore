# Virelion CardioScore – default pipeline configuration

pipeline:
  name: "default_cardioscore"
  version: "0.1.1"
  random_seed: 42

quality_control:
  min_electrodes_per_well: 4
  max_noise_sd_uv: 25.0
  min_beat_detection_rate: 0.7
  # Optional STV-based irregularity proxy. This is not an arrhythmia detector.
  reject_wells_with_arrhythmia_proxy: false
  arrhythmia_proxy_max_stv: null
  log_rejections: true

preprocessing:
  highpass_hz: 0.5
  lowpass_hz: 40.0
  notch_hz: 50.0
  notch_q: 30.0
  detrend: true

beat_detection:
  method: "peak"
  min_prominence_uv: 20.0
  min_distance_ms: 250.0
  refractory_ms: 200.0

features:
  compute_fpd: true
  compute_beat_rate: true
  compute_amplitude: true
  compute_stv: true
  compute_triangulation_proxy: true
  compute_conduction_proxy: false
  window_s: 60.0

experimental_units:
  # Explicit analysis unit. Higher-level choices require the corresponding metadata.
  scoring_unit: "well"
  biological_unit_column: "biological_replicate"
  batch_unit_column: "batch_id"
  plate_unit_column: "plate_id"
  fall_back_to_well: true

control_normalization:
  # Controls are normally matched within compound. Shared controls can be matched
  # by plate, batch, biological replicate, or globally when the study design supports it.
  scope: "compound"
  require_matching_control: true

variability:
  # Optional plate/batch stability diagnostics. These never alter CardioScore.
  enabled: false
  group_column: null
  max_control_cv_pct: 20.0
  correction:
    # Conservative control-anchored recentering; disabled by default.
    enabled: false
    corrected_columns:
      - "fpd_ms"
      - "beat_rate_bpm"
      - "amplitude_uv"
      - "stv"
      - "triangulation_proxy"
    min_controls_per_group: 2
    require_all_groups: true
    assumptions:
      # Validation guardrails for the additive correction model.
      require_treatment_in_all_groups: true
      min_treated_per_group: 1
      max_shift_cv_pct: 50.0
      # Fail closed when assumptions are not met unless deliberately overridden for exploration.
      fail_closed: true

mixed_effects:
  # Optional random-intercept inference; never changes CardioScore automatically.
  enabled: false
  group_column: null
  treatment_column: "_treatment"
  endpoints:
    - "fpd_ms"
    - "beat_rate_bpm"
    - "amplitude_uv"
    - "stv"
    - "triangulation_proxy"

concentration_response:
  replicate_aggregation: "mean"
  concentration_aggregation: "max_absolute_effect"
  min_concentrations: 3
  effect_threshold_pct: 10.0
  fit_curve: false
  fit_min_concentrations: 4
  fit_min_r_squared: 0.80
  fit_min_monotonicity: 0.80
  fit_ec50_boundary_factor: 2.0
  fit_max_ec50_uncertainty_fold: 100.0

inference:
  # Bootstrap uncertainty is opt-in and does not alter CardioScore.
  enabled: false
  n_bootstrap: 2000
  confidence: 0.95
  seed: 42

scoring:
  endpoint_config: "cipa_endpoints.yaml"
  low_threshold: 0.30
  moderate_threshold: 0.60
  normalize_by_vehicle: true
  dose_response_weight: 0.0

reporting:
  generate_html: true
  generate_csv: true
  generate_json: true
  include_plots: true
  plot_style: "seaborn-v0_8-whitegrid"

io:
  supported_formats:
    - "synthetic"
    - "csv_features"
    - "csv_raw_traces"
  output_dir: "./outputs"
