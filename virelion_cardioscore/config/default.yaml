# Virelion CardioScore – default pipeline configuration

pipeline:
  name: "default_cardioscore"
  version: "0.1.1"
  random_seed: 42

quality_control:
  min_electrodes_per_well: 4
  max_noise_sd_uv: 25.0
  min_beat_detection_rate: 0.7
  reject_wells_with_arrhythmia_proxy: false
  arrhythmia_proxy_max_stv: null
  log_rejections: true

preprocessing:
  highpass_hz: 0.5
  lowpass_hz: 40.0
  notch_hz: 50.0
  notch_q: 30.0
  detrend: true

beat_detection:
  method: "peak"
  min_prominence_uv: 20.0
  min_distance_ms: 250.0
  refractory_ms: 200.0

features:
  compute_fpd: true
  compute_beat_rate: true
  compute_amplitude: true
  compute_stv: true
  compute_triangulation_proxy: true
  compute_conduction_proxy: false
  window_s: 60.0

experimental_units:
  scoring_unit: "well"
  biological_unit_column: "biological_replicate"
  batch_unit_column: "batch_id"
  plate_unit_column: "plate_id"
  # Safety default: requesting a higher-level unit without its metadata must fail
  # rather than silently reverting to technical-well scoring.
  fall_back_to_well: false

control_normalization:
  scope: "compound"
  require_matching_control: true

variability:
  enabled: false
  group_column: null
  max_control_cv_pct: 20.0
  correction:
    enabled: false
    corrected_columns:
      - "fpd_ms"
      - "beat_rate_bpm"
      - "amplitude_uv"
      - "stv"
      - "triangulation_proxy"
    min_controls_per_group: 2
    # When true, every correction group must have sufficient vehicle controls
    # and the configured minimum treated observations before correction is allowed.
    require_all_groups: true
    assumptions:
      min_treated_per_group: 1
      max_shift_cv_pct: 50.0
      fail_closed: true

mixed_effects:
  enabled: false
  group_column: null
  treatment_column: "_treatment"
  endpoints:
    - "fpd_ms"
    - "beat_rate_bpm"
    - "amplitude_uv"
    - "stv"
    - "triangulation_proxy"
