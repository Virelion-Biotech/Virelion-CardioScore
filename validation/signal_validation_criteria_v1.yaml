    notebook must label the resulting evaluation provisional/exploratory rather than confirmatory.
beat_detection:
  status: frozen
  tolerance_ms: 50
  f1_min: 0.95
  precision_min: 0.95
  recall_min: 0.95
  timing_median_abs_error_ms_max: 10
